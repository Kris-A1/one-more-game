```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>1M</title>

    <link
        rel="stylesheet"
        href="css/game.css"
    >

</head>


<body>

<main class="game-shell">


    <!-- HEADER -->

    <header class="game-header">

        <div>

            <div class="game-name">
                1M<span>.</span>
            </div>

            <div
                id="levelSubtitle"
                class="game-subtitle"
            >
                LEVEL 1 · NEON RUN
            </div>

        </div>


        <div class="best-score">

            <div>BEST</div>

            <strong id="bestScore">
                0
            </strong>

        </div>

    </header>


    <!-- GAME AREA -->

    <section class="game-container">

        <canvas
            id="gameCanvas"
            width="360"
            height="490"
        ></canvas>


        <!-- SCORE -->

        <div
            id="scoreDisplay"
            class="score-display"
        >

            <small>
                SCORE
            </small>

            <strong id="score">
                0
            </strong>

        </div>


        <!-- MULTIPLIER -->

        <div
            id="multiplierDisplay"
            class="multiplier-display"
        >
            ×1
        </div>


        <!-- STRIKES -->

        <div
            id="strikeDisplay"
            class="strike-display"
        >
            STRIKES ×3
        </div>


        <!-- START / GAME OVER -->

        <div
            id="gameOverlay"
            class="game-overlay"
        >

            <div class="overlay-label">
                JUST ONE MORE RUN
            </div>


            <h1 id="overlayTitle">
                1M<span>.</span>
            </h1>


            <p id="overlayText">
                Dodge. Survive.<br>
                Beat your best.
            </p>


            <!-- LEVEL 3 ANIMAL SELECTOR -->

            <div
                id="animalChooser"
                class="animal-chooser"
            >

                <div class="animal-title">
                    CHOOSE YOUR RUNNER
                </div>


                <div class="animal-grid">


                    <button
                        type="button"
                        class="animal-button selected"
                        data-animal="BUNNY"
                    >

                        <span class="animal-emoji">
                            🐰
                        </span>

                        <span class="animal-name">
                            BUNNY
                        </span>

                    </button>


                    <button
                        type="button"
                        class="animal-button"
                        data-animal="FOX"
                    >

                        <span class="animal-emoji">
                            🦊
                        </span>

                        <span class="animal-name">
                            FOX
                        </span>

                    </button>


                    <button
                        type="button"
                        class="animal-button"
                        data-animal="CAT"
                    >

                        <span class="animal-emoji">
                            🐱
                        </span>

                        <span class="animal-name">
                            CAT
                        </span>

                    </button>


                    <button
                        type="button"
                        class="animal-button"
                        data-animal="PANDA"
                    >

                        <span class="animal-emoji">
                            🐼
                        </span>

                        <span class="animal-name">
                            PANDA
                        </span>

                    </button>


                </div>

            </div>


            <!-- START -->

            <button
                id="startButton"
                class="start-button"
            >
                ▶ START RUN
            </button>


            <div class="instructions">
                ← → MOVE
            </div>

        </div>

    </section>


    <!-- MOBILE CONTROLS -->

    <section class="controls">

        <button
            id="leftButton"
            class="control-button move-button"
            type="button"
        >
            ←
        </button>


        <button
            id="attackButton"
            class="control-button attack-button"
            type="button"
        >
            <span>💥</span>
            <small>STRIKE ×3</small>
        </button>


        <button
            id="rightButton"
            class="control-button move-button"
            type="button"
        >
            →
        </button>

    </section>


    <div
        id="gameMessage"
        class="game-message"
    >
        Ready when you are.
    </div>


</main>


<!-- CACHE VERSION -->

<script src="js/game.js?v=41"></script>

</body>

</html>
```
