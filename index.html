<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>1M — One More</title>

    <link rel="stylesheet" href="css/game.css?v=60">
</head>

<body>

<div class="game-shell">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="game-header">

        <div>
            <div class="game-name">
                1<span>M</span>.
            </div>

            <div class="game-subtitle">
                ONE MORE
            </div>
        </div>

        <div class="best-score">
            BEST
            <strong id="bestScore">0</strong>
        </div>

    </header>


    <!-- =====================================================
         GAME
         ===================================================== -->

    <main
        class="game-container"
        id="gameContainer"
    >

        <canvas
            id="gameCanvas"
            width="360"
            height="490"
        ></canvas>


        <!-- SCORE -->

        <div class="score-display">

            <small>SCORE</small>

            <strong id="score">
                0
            </strong>

        </div>


        <!-- MULTIPLIER -->

        <div
            class="multiplier-display"
            id="multiplier"
        >
            x1
        </div>


        <!-- STRIKES -->

        <div
            class="strike-display"
            id="strikeDisplay"
        >
            STRIKES 0
        </div>


        <!-- =================================================
             OVERLAY
             ================================================= -->

        <div
            class="game-overlay"
            id="overlay"
        >

            <div
                class="overlay-label"
                id="overlayLabel"
            >
                LEVEL 1
            </div>


            <h1 id="overlayTitle">
                NEON <span>RUN</span>
            </h1>


            <p id="overlayText">
                Dodge everything.<br>
                How long can you survive?
            </p>


            <!-- CHARACTER SELECTOR -->

            <div
                class="animal-chooser"
                id="animalChooser"
            >

                <div class="animal-title">
                    CHOOSE YOUR RUNNER
                </div>


                <div class="animal-grid">

                    <button
                        class="animal-button selected"
                        data-animal="BUNNY"
                        type="button"
                    >
                        <span class="animal-emoji">🐰</span>
                        <span class="animal-name">BUNNY</span>
                    </button>


                    <button
                        class="animal-button"
                        data-animal="FOX"
                        type="button"
                    >
                        <span class="animal-emoji">🦊</span>
                        <span class="animal-name">FOX</span>
                    </button>


                    <button
                        class="animal-button"
                        data-animal="CAT"
                        type="button"
                    >
                        <span class="animal-emoji">🐱</span>
                        <span class="animal-name">CAT</span>
                    </button>


                    <button
                        class="animal-button"
                        data-animal="PANDA"
                        type="button"
                    >
                        <span class="animal-emoji">🐼</span>
                        <span class="animal-name">PANDA</span>
                    </button>

                </div>

            </div>


            <!-- START -->

            <button
                class="start-button"
                id="startButton"
                type="button"
            >
                ▶ START
            </button>


            <div
                class="instructions"
                id="attackInstruction"
            >
                ← → MOVE &nbsp;&nbsp; • &nbsp;&nbsp; SPACE ATTACK
            </div>

        </div>

    </main>


    <!-- =====================================================
         CONTROLS
         ===================================================== -->

    <div class="controls">

        <button
            class="control-button move-button"
            id="leftButton"
            type="button"
            aria-label="Move left"
        >
            ‹
        </button>


        <button
            class="control-button attack-button"
            id="attackButton"
            type="button"
            aria-label="Attack"
        >
            <span>⚡</span>
            <small>ATTACK</small>
        </button>


        <button
            class="control-button move-button"
            id="rightButton"
            type="button"
            aria-label="Move right"
        >
            ›
        </button>

    </div>


    <!-- =====================================================
         MESSAGE
         ===================================================== -->

    <div
        class="game-message"
        id="gameMessage"
    >
        ONE MORE.
    </div>

</div>


<script src="js/game.js?v=60"></script>

</body>
</html>
