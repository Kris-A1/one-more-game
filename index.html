<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>ONE MORE</title>

    <link rel="stylesheet" href="css/game.css">
</head>

<body>

    <main class="game-shell">

        <header class="game-header">
            <div>
                <div class="game-name">ONE MORE<span>.</span></div>
                <div class="game-subtitle">LEVEL 1 · NEON RUN</div>
            </div>

            <div class="best-score">
                <div>BEST</div>
                <strong id="bestScore">0</strong>
            </div>
        </header>

        <section class="game-container">

            <canvas
                id="gameCanvas"
                width="360"
                height="490"
            ></canvas>

            <div id="scoreDisplay" class="score-display">
                <small>SCORE</small>
                <strong id="score">0</strong>
            </div>

            <div id="multiplierDisplay" class="multiplier-display">
                ×1
            </div>

            <div id="gameOverlay" class="game-overlay">

                <div class="overlay-label">
                    JUST ONE MORE RUN
                </div>

                <h1 id="overlayTitle">
                    ONE<br>MORE<span>.</span>
                </h1>

                <p id="overlayText">
                    Dodge. Survive.<br>
                    Beat your best.
                </p>

                <button id="startButton">
                    ▶ START RUN
                </button>

                <div class="instructions">
                    ← → MOVE
                </div>

            </div>

        </section>

        <section class="controls">

            <button id="leftButton">
                ←
            </button>

            <button id="rightButton">
                →
            </button>

        </section>

        <div id="gameMessage" class="game-message">
            Ready when you are.
        </div>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
