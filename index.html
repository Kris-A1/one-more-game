<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1M — One More</title>

  <link rel="stylesheet" href="css/game.css?v=50">
</head>

<body>

  <main class="game-shell">

    <header class="topbar">
      <div>
        <div class="logo">1M.</div>
        <div id="levelName" class="level-name">NEON RUN</div>
      </div>

      <div class="best-box">
        <span>BEST</span>
        <strong id="bestScore">0</strong>
      </div>
    </header>


    <section class="game-area">

      <canvas id="gameCanvas"></canvas>

      <div class="hud">

        <div class="score-box">
          <span>SCORE</span>
          <strong id="score">0</strong>
        </div>

        <div class="multiplier-box">
          <span>MULTIPLIER</span>
          <strong id="multiplier">x1</strong>
        </div>

        <div id="strikeDisplay" class="strike-display hidden">
          <span>STRIKES</span>
          <strong id="strikes">×3</strong>
        </div>

      </div>


      <div id="overlay" class="overlay">

        <div id="overlayLabel" class="overlay-label">
          LEVEL 1
        </div>

        <h1 id="overlayTitle">NEON RUN</h1>

        <p id="overlayText">
          Dodge everything.<br>
          How long can you survive?
        </p>


        <div id="animalChooser" class="animal-chooser hidden">

          <div class="chooser-title">
            CHOOSE YOUR RUNNER
          </div>

          <div class="animal-grid">

            <button
              type="button"
              class="animal-card selected"
              data-animal="BUNNY"
            >
              <span class="animal-icon">🐰</span>
              <span class="animal-name">BUNNY</span>
              <span class="animal-check">✓</span>
            </button>

            <button
              type="button"
              class="animal-card"
              data-animal="FOX"
            >
              <span class="animal-icon">🦊</span>
              <span class="animal-name">FOX</span>
              <span class="animal-check">✓</span>
            </button>

            <button
              type="button"
              class="animal-card"
              data-animal="CAT"
            >
              <span class="animal-icon">🐱</span>
              <span class="animal-name">CAT</span>
              <span class="animal-check">✓</span>
            </button>

            <button
              type="button"
              class="animal-card"
              data-animal="PANDA"
            >
              <span class="animal-icon">🐼</span>
              <span class="animal-name">PANDA</span>
              <span class="animal-check">✓</span>
            </button>

          </div>

        </div>


        <button
          id="startButton"
          type="button"
          class="start-button"
        >
          ▶ START
        </button>

        <div class="instructions">
          <span>← →</span> MOVE
          <span id="attackInstruction" class="hidden">
            <span>SPACE</span> STRIKE
          </span>
        </div>

      </div>

    </section>


    <section class="controls">

      <button
        id="leftButton"
        type="button"
        class="control-button move-button"
        aria-label="Move left"
      >
        <span>←</span>
      </button>

      <button
        id="attackButton"
        type="button"
        class="control-button attack-button hidden"
        aria-label="Strike obstacle"
      >
        <span class="attack-icon">💥</span>
        <span class="attack-label">STRIKE</span>
        <span id="attackCount">×3</span>
      </button>

      <button
        id="rightButton"
        type="button"
        class="control-button move-button"
        aria-label="Move right"
      >
        <span>→</span>
      </button>

    </section>


    <div
      id="gameMessage"
      class="game-message"
      aria-live="polite"
    ></div>

  </main>


  <script src="js/game.js?v=50"></script>

</body>
</html>
